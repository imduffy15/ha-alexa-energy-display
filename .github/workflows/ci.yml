name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q

  apl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --ignore-scripts apl-suggester@2024.2.0
      - run: >
          node tools/validate-apl.js
          lambda/apl/fullscreen.json lambda/apl/empty.json
          skill-package/dataStorePackages/EnergyWidget/documents/document.json
      - name: JSON files parse
        run: find skill-package lambda -name '*.json' -o -name '*.tpl' | xargs -I{} node -e 'JSON.parse(require("fs").readFileSync("{}","utf8"))'

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
